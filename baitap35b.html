<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đồng hồ đếm ngược 10 phút</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .timer-container {
      text-align: center;
      background: #1e293b;
      padding: 3rem 4rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .real-time-clock {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 1rem;
      letter-spacing: 0.5px;
    }

    .countdown-display {
      font-size: 5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums; /* Giữ độ rộng số cố định, không bị giật khung hình */
      letter-spacing: 4px;
      margin: 1rem 0 2rem;
      color: #38bdf8;
      transition: color 0.3s ease;
    }

    /* Animation cảnh báo khi dưới 1 phút */
    .countdown-display.warning {
      color: #ef4444;
      animation: pulseWarning 1s infinite ease-in-out;
    }

    @keyframes pulseWarning {
      0%, 100% {
        transform: scale(1);
        text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
      }
      50% {
        transform: scale(1.06);
        text-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
      }
    }

    .controls button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 0 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
    }

    .controls button:active {
      transform: scale(0.96);
    }

    #startBtn { background-color: #22c55e; color: #fff; }
    #startBtn:hover { background-color: #16a34a; }
    #startBtn:disabled { background-color: #475569; cursor: not-allowed; }

    #resetBtn { background-color: #64748b; color: #fff; }
    #resetBtn:hover { background-color: #475569; }

    /* Modal Alert */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-box h2 {
      color: #ef4444;
      margin-bottom: 1rem;
    }

    .modal-box p {
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }

    .modal-box button {
      padding: 0.6rem 2rem;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <div class="real-time-clock" id="realTimeClock">Giờ hiện tại: --:--:--</div>
    <h1>Đếm ngược 10 phút</h1>
    <div class="countdown-display" id="countdownDisplay">10:00</div>
    <div class="controls">
      <button id="startBtn">Bắt đầu</button>
      <button id="resetBtn">Đặt lại</button>
    </div>
  </div>

  <!-- Modal Alert khi hết giờ -->
  <div class="modal-overlay" id="alertModal">
    <div class="modal-box">
      <h2>Hết thời gian!</h2>
      <p>Thời gian đếm ngược 10 phút đã kết thúc.</p>
      <button id="closeModalBtn">Đóng</button>
    </div>
  </div>

  <script>
    const INITIAL_SECONDS = 10 * 60; // 600 giây
    let countdownInterval = null;
    let clockInterval = null;
    let endTime = null;

    const realTimeClockEl = document.getElementById('realTimeClock');
    const displayEl = document.getElementById('countdownDisplay');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const alertModal = document.getElementById('alertModal');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // 1. Đồng hồ thời gian thực (Real-time Clock)
    function updateRealTimeClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('vi-VN', { hour12: false });
      const dateString = now.toLocaleDateString('vi-VN');
      realTimeClockEl.textContent = `Thời gian thực: ${timeString} -${dateString}`;
    }

    // Khởi chạy đồng hồ thời gian thực ngay khi tải trang
    updateRealTimeClock();
    clockInterval = setInterval(updateRealTimeClock, 1000);

    // 2. Hàm định dạng MM:SS
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // 3. Logic đếm ngược dựa trên mốc thời gian thực (Delta Time)
    function startCountdown() {
      // Dọn dẹp interval cũ trước khi tạo mới để tránh trùng lặp
      clearCountdown();

      // Tính mốc thời gian kết thúc dựa trên đồng hồ hệ thống thực tế
      endTime = Date.now() + INITIAL_SECONDS * 1000;
      startBtn.disabled = true;

      // Chạy tick mỗi 250ms thay vì 1000ms để UI mượt và không bị trễ nhịp giây
      countdownInterval = setInterval(() => {
        const remainingMs = endTime - Date.now();
        const remainingSeconds = Math.max(0, Math.ceil(remainingMs / 1000));

        displayEl.textContent = formatTime(remainingSeconds);

        // Kích hoạt animation khi dưới 1 phút (từ 59s đến 1s)
        if (remainingSeconds > 0 && remainingSeconds < 60) {
          displayEl.classList.add('warning');
        } else {
          displayEl.classList.remove('warning');
        }

        // Khi hết thời gian
        if (remainingSeconds <= 0) {
          clearCountdown();
          alertModal.classList.add('active');
          startBtn.disabled = false;
        }
      }, 250);
    }

    function clearCountdown() {
      if (countdownInterval !== null) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    function resetCountdown() {
      clearCountdown();
      displayEl.textContent = formatTime(INITIAL_SECONDS);
      displayEl.classList.remove('warning');
      startBtn.disabled = false;
    }

    // Sự kiện nút bấm
    startBtn.addEventListener('click', startCountdown);
    resetBtn.addEventListener('click', resetCountdown);
    closeModalBtn.addEventListener('click', () => {
      alertModal.classList.remove('active');
    });

    // Dọn dẹp toàn bộ interval khi người dùng rời trang/đóng tab
    window.addEventListener('beforeunload', () => {
      clearCountdown();
      if (clockInterval !== null) {
        clearInterval(clockInterval);
        clockInterval = null;
      }
    });
  </script>
</body>
</html>
